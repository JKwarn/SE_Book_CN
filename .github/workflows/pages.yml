name: 部署 GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "_book/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 准备静态网站文件
        run: |
          test -f _book/index.html
          mkdir -p _site
          cp -a _book/. _site/
          rm -f _site/auto_publish.sh _site/package-lock.json
          touch _site/.nojekyll

      - name: 修复 GitBook 章节页面导航
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = """
          <script>
          // GitBook 3's AJAX page replacement is unreliable for these generated
          // pages, whose article bodies contain embedded HTML document tags.
          // Let same-site document links use normal browser navigation instead.
          document.addEventListener('click', function (event) {
              if (event.defaultPrevented || event.button !== 0 ||
                  event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                  return;
              }

              var target = event.target;
              var link = target && target.closest ? target.closest('a[href]') : null;
              if (!link || link.target || link.hasAttribute('download')) {
                  return;
              }

              var destination;
              try {
                  destination = new URL(link.href, document.baseURI);
              } catch (_) {
                  return;
              }

              if (destination.origin !== window.location.origin) {
                  return;
              }

              if (destination.pathname === window.location.pathname && destination.hash) {
                  return;
              }

              if (!/\.html?$/i.test(destination.pathname) &&
                  !destination.pathname.endsWith('/')) {
                  return;
              }

              // Capture phase prevents GitBook's delegated AJAX handler from
              // cancelling the click; the browser's normal link action remains.
              event.stopImmediatePropagation();
          }, true);
          </script>
          """

          html_files = list(Path("_site").rglob("*.html"))
          if not html_files:
              raise SystemExit("没有找到需要处理的 HTML 页面")

          for path in html_files:
              page = path.read_text(encoding="utf-8")
              if "GitBook 3's AJAX page replacement is unreliable" in page:
                  continue
              marker = "</body>"
              if marker not in page.lower():
                  continue
              index = page.lower().rfind(marker)
              page = page[:index] + script + "\n" + page[index:]
              path.write_text(page, encoding="utf-8")

          print(f"已为 {len(html_files)} 个 HTML 页面添加原生导航回退")
          PY

      - name: 上传网站构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
