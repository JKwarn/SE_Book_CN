name: 部署 GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "_book/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 准备静态网站文件
        run: |
          test -f _book/index.html
          mkdir -p _site
          cp -a _book/. _site/
          rm -f _site/auto_publish.sh _site/package-lock.json
          touch _site/.nojekyll

      - name: 上传网站构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
